<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/img/logo-mn.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F59820" />
    <meta name="description" content="MN Inmobiliaria: apartamentos, casas y locales en venta y alquiler en Puerto Ordaz, Venezuela. Fotos reales, precio claro y contacto directo por WhatsApp." />
    <!-- [249A-1] SEO con intencion local: canonica absoluta, OG/Twitter para
      compartir y JSON-LD del negocio (el detalle es solo-modal, sin URLs con
      slug: el SEO por inmueble va en sitemap + ItemList, ver F5/F8). -->
    <link rel="canonical" href="https://mn-inmobiliaria.com/" />
    <!-- [249A-3] Preload del heroe ELIMINADO: `PresentacionCaja` (el unico
      uso de `presentacion.jpg` como fondo) no se renderiza — la portada
      actual es `Presentacion` (texto). El preload competia con JS/CSS por
      502 KB nunca mostrados. Se conserva `og:image`/`twitter:image` (solo
      la piden los crawlers al compartir). Si el heroe vuelve, el preload
      debe volver con el en la misma tarea. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MN Inmobiliaria" />
    <meta property="og:title" content="MN Inmobiliaria - Inmuebles en Puerto Ordaz" />
    <meta property="og:description" content="Apartamentos, casas y locales en venta y alquiler en Puerto Ordaz. Fotos reales y contacto directo." />
    <meta property="og:url" content="https://mn-inmobiliaria.com/" />
    <meta property="og:image" content="https://mn-inmobiliaria.com/img/presentacion.jpg" />
    <meta property="og:locale" content="es_VE" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MN Inmobiliaria - Inmuebles en Puerto Ordaz" />
    <meta name="twitter:description" content="Apartamentos, casas y locales en venta y alquiler en Puerto Ordaz." />
    <meta name="twitter:image" content="https://mn-inmobiliaria.com/img/presentacion.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "RealEstateAgent",
        "name": "MN Inmobiliaria",
        "url": "https://mn-inmobiliaria.com/",
        "areaServed": { "@type": "City", "name": "Puerto Ordaz" },
        "address": { "@type": "PostalAddress", "addressLocality": "Puerto Ordaz", "addressCountry": "VE" }
      }
    </script>
    <title>MN Inmobiliaria - Inmuebles en Puerto Ordaz</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar parpadeo.
      try {
        var t = localStorage.getItem('inmobiliaria:tema:v1') || 'sistema';
        if (t === 'oscuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
